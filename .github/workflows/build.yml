name: Build

on:
  push:
    branches: [main]
    paths: ["App/**", "project.yml", "ci/**", "engine/**", "rust/**", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload this build to TestFlight
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE: /Applications/Xcode_26.6.app

jobs:
  screens:
    name: Simulator build and screenshots
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            rust/harbor-ffi/target
            ~/.cargo/registry
            engine/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('rust/harbor-ffi/Cargo.lock', 'engine/package-lock.json') }}
      - name: Build Rust static libraries
        run: rust/build.sh
      - name: Build engine bundle
        run: |
          cd engine && npm ci --no-audit --no-fund && node build.mjs
          mkdir -p ../App/Resources && cp dist/harbor-engine.js ../App/Resources/
      - name: Generate project
        run: |
          sudo xcode-select -s "$XCODE"
          brew install xcodegen
          xcodegen generate
      - name: UI tests
        run: |
          set -o pipefail
          xcrun simctl list devices available | grep -i "apple tv" || true
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          tv = [(rt, d) for rt, ds in devs.items() if "tvOS" in rt for d in ds if "4K" in d["name"]]
          tv.sort(key=lambda x: [int(n) for n in x[0].split("tvOS-")[1].split("-")])
          print(tv[-1][1]["udid"] if tv else "")')
          if [ -z "$SIM_ID" ]; then
            RUNTIME=$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="tvOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
            SIM_ID=$(xcrun simctl create "Harbor TV" "Apple TV 4K (3rd generation)" "$RUNTIME")
          fi
          echo "Using simulator $SIM_ID"
          xcodebuild test -project Harbor.xcodeproj -scheme Harbor \
            -destination "platform=tvOS Simulator,id=$SIM_ID" \
            -resultBundlePath build/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
      - name: Export screenshots and test summary
        if: always()
        run: |
          mkdir -p build/screens
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/screens || true
          xcrun xcresulttool get test-results summary --path build/ui.xcresult > build/screens/summary.json || true
          xcrun xcresulttool get test-results tests --path build/ui.xcresult > build/screens/tests.json || true
          python3 - <<'PY' || true
          import json
          s = json.load(open("build/screens/summary.json"))
          print("result:", s.get("result"), "passed", s.get("passedTests"), "failed", s.get("failedTests"))
          for f in s.get("testFailures", []):
              print("FAIL", f.get("testName"), "::", f.get("failureText"))
          PY
          mkdir -p build/screens/crashes
          cp -R ~/Library/Logs/DiagnosticReports/*.ips build/screens/crashes/ 2>/dev/null || true
          ls ~/Library/Logs/CoreSimulator/*/CrashReporter 2>/dev/null | head || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: build/screens
          retention-days: 14

  testflight:
    name: Archive and upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight && github.actor == github.repository_owner
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/cache@v4
        with:
          path: |
            rust/harbor-ffi/target
            ~/.cargo/registry
            engine/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('rust/harbor-ffi/Cargo.lock', 'engine/package-lock.json') }}
      - name: Build Rust static libraries
        run: rust/build.sh
      - name: Build engine bundle
        run: |
          cd engine && npm ci --no-audit --no-fund && node build.mjs
          mkdir -p ../App/Resources && cp dist/harbor-engine.js ../App/Resources/
      - name: Generate project
        run: |
          sudo xcode-select -s "$XCODE"
          brew install xcodegen
          xcodegen generate
      - name: Install signing identity and profile
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROFILE_B64" | base64 --decode > "$dir/harbor.mobileprovision"
          done
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          set -o pipefail
          xcodebuild archive -project Harbor.xcodeproj -scheme Harbor \
            -destination "generic/platform=tvOS" \
            -archivePath build/Harbor.xcarchive \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" | xcbeautify
      - name: Upload to App Store Connect
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" > "$KEY"
          sed -e "s/__TEAM_ID__/$TEAM_ID/" -e "s/__PROFILE_NAME__/$PROFILE_NAME/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/Harbor.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/AuthKey_*.p8
