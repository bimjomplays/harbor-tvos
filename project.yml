name: Harbor
options:
  bundleIdPrefix: com.dltnp
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "3"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0
targets:
  Harbor:
    type: application
    platform: tvOS
    sources:
      - App/Sources
      - App/Assets.xcassets
      - path: App/Engine
        buildPhase: resources
      - path: App/Fonts
        buildPhase: resources
      # The phone hand-off page the TV serves on the LAN (App/Sources/Handoff); never fetched.
      - path: App/Phone
        buildPhase: resources
      - path: App/Upstream/avatars
        type: folder
        buildPhase: resources
      - path: App/Upstream/kids
        type: folder
        buildPhase: resources
      - path: App/Upstream/marks
        type: folder
        buildPhase: resources
    dependencies:
      - package: MPVKit
        product: MPVKit
    entitlements:
      path: App/Harbor.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.dltnp.harbor"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Harbor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [Switzer-Regular.otf, Switzer-Medium.otf, Switzer-Semibold.otf, Switzer-Bold.otf, Sentient-Regular.otf, Sentient-Medium.otf, Sentient-Bold.otf, Fraunces-Medium.ttf]
        ITSAppUsesNonExemptEncryption: false
        # Stage 12 music keeps playing on the Apple TV home screen (App/Sources/Music/MusicPlayer.swift).
        UIBackgroundModes: [audio]
        # Stage 10 phone hand-off: the TV listens on the LAN only while a phone code is on screen.
        NSLocalNetworkUsageDescription: Harbor opens a small page on your network while a phone code is on screen, so your phone can type and sign in for this TV.
        # lib/deep-link.ts: harbor://detail/<type>/<id>[/<videoId>], stremio://detail/..., stremio://<host>/manifest.json
        CFBundleURLTypes:
          - CFBundleURLName: com.dltnp.harbor.links
            CFBundleURLSchemes: [harbor, stremio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dltnp.harbor
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/rust/harbor-ffi/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/rust/out/$(PLATFORM_NAME)
        # CoreFoundation: librqbit -> chrono -> iana-time-zone reads the zone through CFTimeZone,
        # and a staticlib does not carry its #[link] directives into the app link.
        OTHER_LDFLAGS: -lharbor_ffi -framework CoreFoundation
        MTL_ENABLE_DEBUG_INFO: NO
  HarborUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - App/UITests
    dependencies:
      - target: Harbor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dltnp.harbor.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Harbor:
    build:
      targets:
        Harbor: all
        HarborUITests: [test]
    test:
      targets:
        - HarborUITests
    archive:
      config: Release
